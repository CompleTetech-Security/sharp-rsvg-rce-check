name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.14']
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Verify single-file distribution
        run: python tools/build.py --check
      - name: Run synthetic offline tests
        run: python -m unittest -v
      - name: Check CLI help
        run: python sharp_rsvg_rce_check.py --help
      - name: Run documented synthetic inventory
        run: python sharp_rsvg_rce_check.py --inventory examples/inventory.json --format json
      - name: Check whitespace
        run: git diff --check
